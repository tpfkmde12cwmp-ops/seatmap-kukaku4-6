<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="座席区画④">
<title>座席区画④</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding: max(16px,env(safe-area-inset-top)) 12px 28px;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto}
h1{font-size:22px;margin:8px 0 14px}
.auth{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;margin-bottom:14px}
.auth h2{font-size:15px;margin:0 0 10px}
.auth input{display:block;width:100%;font:inherit;padding:11px;border:1px solid #bbb;border-radius:8px;margin:8px 0}
.auth button,.action{font:inherit;border:1px solid #aaa;border-radius:9px;padding:10px 12px;background:#fff;color:#222}
.auth button{margin:4px 6px 0 0}
#authStatus{font-size:12px;color:#555;margin-top:8px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:white;border:1px solid #ddd;border-radius:12px;padding:11px 5px;text-align:center}
.num{display:block;font-size:25px;font-weight:750;font-variant-numeric:tabular-nums}
.label{color:#666;font-size:12px}
.counter{width:100%;padding:12px;background:#fff;border:1px solid #aaa;border-radius:10px;font-weight:700;margin:0 0 12px}
.toolbar{display:flex;gap:8px;margin:10px 0}
.mode{flex:1;font-weight:650}
.mode.active{background:#ffd928;color:#222;border-color:#d0a900}
.mode.erase-active{background:#222;color:#fff;border-color:#222}
.hint{font-size:12px;color:#666;margin:8px 0 10px}
.seat-wrap{overflow-x:auto;padding:2px 0 8px}
.seat-grid{min-width:350px;display:grid;grid-template-columns:26px repeat(8,minmax(0,1fr));gap:4px}
.colhead,.rowhead{display:flex;justify-content:center;align-items:center;color:#555;font-size:12px;min-height:24px}
.seat{min-width:0;min-height:38px;padding:4px 0;border:1px solid #aaa;border-radius:6px;background:#fff;font-size:12px;font-weight:650;touch-action:manipulation}
.seat.used{background:#ffd928;border-color:#d0a900}
.seat.blocked{background:#222;border-color:#222}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:12px 0;font-size:12px;color:#555}
.swatch{display:inline-block;width:14px;height:14px;border:1px solid #aaa;border-radius:3px;vertical-align:-3px;margin-right:5px}
.bottom{display:flex;gap:8px}
.bottom button{flex:1}
#undo{background:#222;color:#fff;border-color:#222}
.note{margin-top:12px;font-size:11px;color:#777;line-height:1.5}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>座席区画④</h1>
<section class="auth">
<h2>クラウド同期ログイン</h2>
<input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
<input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
<button id="login" type="button">ログイン</button>
<button id="logout" type="button" hidden>ログアウト</button>
<div id="authStatus">メールアドレスとパスワードでログインしてください。iPhoneとiPadで同じアカウントを使用します。</div>
</section>
<section class="stats" aria-label="座席集計">
<div class="stat"><span class="num" id="total">126</span><span class="label">座席数</span></div>
<div class="stat"><span class="num" id="attendees">0</span><span class="label">出席人数</span></div>
<div class="stat"><span class="num" id="empty">126</span><span class="label">空席</span></div>
</section>
<button class="counter" id="count" type="button">空席カウント</button>
<div><strong>操作モード</strong></div>
<div class="toolbar">
<button class="action mode active" id="paint" type="button" aria-pressed="true">使用</button>
<button class="action mode" id="erase" type="button" aria-pressed="false">空席</button>
</div>
<p class="hint">座席番号をタップして使用・空席を切り替えます。</p>
<div class="seat-wrap"><div class="seat-grid" id="grid" aria-label="座席一覧"></div></div>
<div class="legend">
<span><i class="swatch" style="background:white"></i>空席</span>
<span><i class="swatch" style="background:#ffd928;border-color:#d0a900"></i>使用</span>
<span><i class="swatch" style="background:#222;border-color:#222"></i>使用不可</span>
</div>
<div class="bottom">
<button class="action" id="undo" type="button">1つ戻す</button>
<button class="action" id="reset" type="button">リセット</button>
</div>
<p class="note">ログイン中は座席の状態をクラウドに保存し、同じアカウントでログインした端末間で共有します。</p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmsqcJvv9MNpVjaQ-vXCLcA6eMPTHdiq8",
  authDomain: "seatmap-kukaku4.firebaseapp.com",
  projectId: "seatmap-kukaku4",
  storageBucket: "seatmap-kukaku4.firebasestorage.app",
  messagingSenderId: "180489031946",
  appId: "1:180489031946:web:da475c2bcd145a8f6eaaf3"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ROWS=16, FIRST_SEAT=24, COLS=8;
const BLOCKED=new Set(["4-27","4-28"]);
const total=ROWS*COLS-BLOCKED.size;
let used=new Set(), mode="paint", history=[], currentRef=null, unsubscribe=null, applyingRemote=false, saveQueue=Promise.resolve();
const $=id=>document.getElementById(id);
$("total").textContent=total;

function updateStats(){
  $("attendees").textContent=used.size;
  $("empty").textContent=total-used.size;
}
function renderSeat(button,key){
  const yes=used.has(key);
  button.classList.toggle("used",yes);
  button.setAttribute("aria-pressed",String(yes));
}
function renderAll(){
  document.querySelectorAll(".seat:not(.blocked)").forEach(b=>renderSeat(b,b.dataset.key));
  updateStats();
}
function setMode(next){
  mode=next;
  $("paint").classList.toggle("active",next==="paint");
  $("erase").classList.toggle("erase-active",next==="erase");
  $("paint").setAttribute("aria-pressed",String(next==="paint"));
  $("erase").setAttribute("aria-pressed",String(next==="erase"));
}
$("paint").addEventListener("click",()=>setMode("paint"));
$("erase").addEventListener("click",()=>setMode("erase"));

const grid=$("grid");
grid.appendChild(document.createElement("div"));
for(let c=0;c<COLS;c++){const h=document.createElement("div");h.className="colhead";h.textContent=FIRST_SEAT+c;grid.appendChild(h);}
for(let r=1;r<=ROWS;r++){
  const rh=document.createElement("div");rh.className="rowhead";rh.textContent=r;grid.appendChild(rh);
  for(let c=0;c<COLS;c++){
    const n=FIRST_SEAT+c,key=`${r}-${n}`,b=document.createElement("button");
    b.type="button";b.className="seat";b.textContent=n;b.dataset.key=key;
    if(BLOCKED.has(key)){b.classList.add("blocked");b.disabled=true;}
    else b.addEventListener("click",()=>{
      if(!auth.currentUser){$("authStatus").textContent="先にログインしてください。";return;}
      history.push([...used]);
      if(mode==="paint")used.add(key);else used.delete(key);
      renderSeat(b,key);updateStats();saveCloud();
    });
    grid.appendChild(b);
  }
}
function saveCloud(){
  if(!currentRef||!auth.currentUser||applyingRemote)return;
  const payload={used:[...used],updatedAt:Date.now()};
  saveQueue=saveQueue.then(()=>setDoc(currentRef,payload)).catch(e=>{
    $("authStatus").textContent="クラウド保存に失敗しました: "+e.message;
  });
}
$("undo").addEventListener("click",()=>{
  if(!auth.currentUser){$("authStatus").textContent="先にログインしてください。";return;}
  if(!history.length)return;
  used=new Set(history.pop());renderAll();saveCloud();
});
$("reset").addEventListener("click",()=>{
  if(!auth.currentUser){$("authStatus").textContent="先にログインしてください。";return;}
  if(!confirm("すべての座席を空席に戻しますか？"))return;
  history.push([...used]);used.clear();renderAll();saveCloud();
});
$("count").addEventListener("click",()=>{
  $("authStatus").textContent=`空席 ${total-used.size} 席 ／ 出席 ${used.size} 人`;
});

$("login").addEventListener("click",async()=>{
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){$("authStatus").textContent="メールアドレスとパスワードを入力してください。";return;}
  $("login").disabled=true;
  try{await signInWithEmailAndPassword(auth,email,password);}
  catch(e){$("authStatus").textContent="ログインできませんでした。メールアドレス・パスワードを確認してください。（"+e.code+"）";}
  finally{$("login").disabled=false;}
});
$("logout").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,user=>{
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  currentRef=null;history=[];
  $("logout").hidden=!user;
  $("login").hidden=!!user;
  $("email").hidden=!!user;
  $("password").hidden=!!user;
  if(!user){$("authStatus").textContent="ログインしていません。";used=new Set();renderAll();return;}
  currentRef=doc(db,"users",user.uid,"seatmap","current");
  $("authStatus").textContent="ログイン中。クラウドデータを読み込んでいます…";
  unsubscribe=onSnapshot(currentRef,snap=>{
    applyingRemote=true;
    if(snap.exists()){
      const data=snap.data();
      used=new Set(Array.isArray(data.used)?data.used.filter(k=>typeof k==="string"&&!BLOCKED.has(k)):[]);
    }else{
      used=new Set();
      setDoc(currentRef,{used:[],updatedAt:Date.now()}).catch(e=>$("authStatus").textContent="初期保存に失敗: "+e.message);
    }
    renderAll();applyingRemote=false;
    $("authStatus").textContent="ログイン中・クラウド同期中（"+user.email+"）";
  },e=>{
    applyingRemote=false;
    $("authStatus").textContent="クラウド接続に失敗しました。Firestoreルールを確認してください。（"+e.code+"）";
  });
});
updateStats();
</script>
</body>
</html>
