<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="座席表④">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>座席区画④</title>
  <style>
    :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding: max(16px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom)); background:#f5f5f5; color:#222; }
    main { max-width:760px; margin:0 auto; }
    h1 { font-size:22px; margin:8px 0 16px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
    .stat { background:white; border:1px solid #ddd; border-radius:12px; padding:12px 6px; text-align:center; }
    .num { display:block; font-size:25px; font-weight:750; font-variant-numeric:tabular-nums; }
    .label { color:#666; font-size:12px; }
    .toolbar { display:flex; gap:8px; margin:12px 0 8px; }
    button { font:inherit; cursor:pointer; border:1px solid #aaa; border-radius:10px; padding:11px 14px; background:white; color:#222; }
    .mode { flex:1; font-weight:650; }
    .mode.active { background:#ffdc32; color:#222; border-color:#d0a900; }
    body[data-mode="paint"] #erase { background:#fff; color:#222; border-color:#aaa; }
    body[data-mode="erase"] #erase { background:#222; color:#fff; border-color:#222; }
    .hint { font-size:12px; color:#666; margin:8px 0 12px; }
    .seat-wrap { overflow-x:auto; padding:2px 0 8px; }
    .seat-grid { min-width:350px; display:grid; grid-template-columns:26px repeat(8,minmax(0,1fr)); gap:4px; }
    .colhead,.rowhead { display:flex; justify-content:center; align-items:center; color:#555; font-size:12px; min-height:24px; }
    .seat { min-width:0; min-height:38px; padding:4px 0; border:1px solid #aaa; border-radius:6px; background:#fff; font-size:12px; font-weight:650; touch-action:manipulation; }
    .seat.used { background:#ffdc32; border-color:#d0a900; }
    .seat.blocked { background:#222; border-color:#222; cursor:default; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:12px 0 16px; font-size:12px; color:#555; }
    .swatch { display:inline-block; width:14px; height:14px; border:1px solid #aaa; border-radius:3px; vertical-align:-3px; margin-right:5px; }
    .actions { display:flex; justify-content:flex-end; }
    .reset { font-size:13px; }
    .login-card { max-width:440px; margin:28px auto; padding:20px; background:#fff; border:1px solid #ddd; border-radius:14px; }
    .login-card h2 { margin:0 0 12px; font-size:20px; }
    .login-card p { font-size:13px; color:#555; line-height:1.5; }
    .login-card label { display:block; margin:12px 0 5px; font-size:13px; font-weight:650; }
    .login-card input { width:100%; padding:12px; border:1px solid #aaa; border-radius:8px; font:inherit; }
    .login-buttons { display:flex; gap:8px; margin-top:16px; }
    .login-buttons button { flex:1; font-weight:700; }
    #loginMessage { min-height:1.5em; color:#b42318; }
    .account-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 10px; font-size:12px; color:#555; }
    .sync-status { margin:8px 0 12px; padding:9px 11px; border-radius:9px; background:#eef2ff; color:#334155; font-size:12px; }
    .note { margin-top:16px; font-size:11px; color:#777; line-height:1.5; }
    .pages { display:flex; gap:8px; margin:0 0 14px; }
    .page { flex:1; font-weight:700; }
    .page.active { background:#222; color:#fff; border-color:#222; }
    .panel[hidden] { display:none; }
    .attendance-card { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 14px; }
    .attendance-stat { background:#fff; border:1px solid #ddd; border-radius:14px; padding:18px 8px; text-align:center; }
    .attendance-stat .num { font-size:clamp(34px,10vw,54px); line-height:1.15; margin:5px 0; }
    .attendance-stat .label { font-size:14px; }
    .counter-area { min-height:48vh; display:flex; flex-direction:column; gap:12px; }
    .count-button { flex:1; min-height:230px; width:100%; border:0; border-radius:20px; background:#2563eb; color:white; font-size:clamp(27px,7vw,38px); font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; box-shadow:0 5px 0 #1746a2; touch-action:manipulation; }
    .count-button:active { transform:translateY(2px); box-shadow:0 3px 0 #1746a2; }
    .count-button:disabled { opacity:.45; box-shadow:none; }
    .count-sub { font-size:15px; font-weight:500; }
    .counter-actions { display:flex; gap:8px; }
    .counter-actions button { flex:1; min-height:48px; font-weight:650; }
    @media (min-width:600px) { .seat { min-height:44px; font-size:14px; } }
  </style>
</head>
<body>
<main>
  <h1>座席区画④</h1>
  <section class="login-card" id="loginPanel">
    <h2>ログイン</h2>
    <p>iPhoneとiPadで同じメールアドレス・パスワードを使ってください。初めて使う場合は「新規登録」を押してください。</p>
    <label for="loginEmail">メールアドレス</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="メールアドレス" required>
    <label for="loginPassword">パスワード（6文字以上）</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード" minlength="6" required>
    <div class="login-buttons">
      <button id="signInButton" type="button">ログイン</button>
      <button id="signUpButton" type="button">新規登録</button>
    </div>
    <p id="loginMessage" role="status"></p>
  </section>
  <div id="appContent" hidden>
  <div class="account-bar"><span id="signedInEmail"></span><button id="signOutButton" type="button">ログアウト</button></div>
  <nav class="pages" aria-label="画面切り替え">
    <button class="page active" id="seatPageButton" type="button" aria-pressed="true">座席表</button>
    <button class="page" id="attendancePageButton" type="button" aria-pressed="false">出席人数カウント</button>
  </nav>

  <section class="panel" id="seatPanel">
    <section class="stats" aria-label="座席集計">
      <div class="stat"><span class="num" id="total">126</span><span class="label">座席数</span></div>
      <div class="stat"><span class="num" id="used">0</span><span class="label">使用</span></div>
      <div class="stat"><span class="num" id="empty">126</span><span class="label">空席</span></div>
    </section>
    <div><strong>操作モード</strong></div>
    <div class="toolbar">
      <button class="mode active" id="paint" type="button" aria-pressed="true">使用</button>
      <button class="mode" id="erase" type="button" aria-pressed="false">空席</button>
    </div>
    <p class="hint">座席番号をタッチして使用・空席を切り替えます。</p>
    <div class="seat-wrap"><div class="seat-grid" id="grid" aria-label="座席一覧"></div></div>
    <div class="legend">
      <span><i class="swatch" style="background:white"></i>空席</span>
      <span><i class="swatch" style="background:#ffdc32;border-color:#d0a900"></i>使用</span>
      <span><i class="swatch" style="background:#222;border-color:#222"></i>使用不可</span>
    </div>
    <div class="actions"><button class="reset" id="reset" type="button">全て空席に戻す</button></div>
  </section>

  <section class="panel" id="attendancePanel" hidden>
    <div class="attendance-card" aria-live="polite">
      <div class="attendance-stat">
        <span class="label">空席カウント</span>
        <span class="num" id="vacancyCount">0</span>
        <span class="label">席</span>
      </div>
      <div class="attendance-stat">
        <span class="label">出席人数</span>
        <span class="num" id="attendeeCount">126</span>
        <span class="label">人</span>
      </div>
    </div>
    <p class="hint">総座席数126席 − 空席カウント ＝ 出席人数</p>
    <div class="counter-area">
      <button class="count-button" id="countVacancy" type="button">空席カウント</button>
      <div class="counter-actions">
        <button id="undoVacancy" type="button">1つ戻す</button>
        <button id="resetVacancy" type="button">リセット</button>
      </div>
    </div>
  </section>
  <p class="sync-status" id="syncStatus" role="status">共有設定を確認しています…</p>
  <p class="note">iPhone・iPadで同じデータを共有します。共有設定が完了するまでは、この端末内に保存されます。</p>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
(() => {
  const ROWS = 16, FIRST_SEAT = 24, COLS = 8;
  const BLOCKED = new Set(["4-27", "4-28"]);
  const STORAGE_KEY = "seatmap-kaku4-v1";
  const VACANCY_KEY = "seatmap-kaku4-vacancy-v1";
  let mode = "paint";
  document.body.dataset.mode = mode;
  let vacancyCount = 0;
  let used = new Set();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) used = new Set(saved.filter(k => typeof k === "string" && !BLOCKED.has(k)));
  } catch (_) {}
  try {
    const savedVacancy = Number(localStorage.getItem(VACANCY_KEY) || 0);
    vacancyCount = Number.isFinite(savedVacancy) ? Math.max(0, Math.min(126, Math.floor(savedVacancy))) : 0;
  } catch (_) {}
  const grid = document.getElementById("grid");
  const total = ROWS * COLS - BLOCKED.size;
  document.getElementById("total").textContent = total;
  const syncStatus = document.getElementById("syncStatus");
  let cloudRef = null, cloudReady = false, applyingRemote = false;
  function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...used])); } catch (_) {} }
  function saveVacancyLocal() { try { localStorage.setItem(VACANCY_KEY, String(vacancyCount)); } catch (_) {} }
  function setSyncMessage(message) { syncStatus.textContent = message; }
  function refreshAllSeats() {
    document.querySelectorAll(".seat:not(.blocked)").forEach(b => {
      const row = Number(b.getAttribute("aria-label").match(/第(\d+)列/)[1]);
      const seat = Number(b.textContent);
      renderSeat(b, `${row}-${seat}`);
    });
    updateStats(); updateVacancy();
  }
  async function writeCloud(mutator) {
    if (!cloudReady || !cloudRef) { saveLocal(); saveVacancyLocal(); return; }
    try {
      await firebase.firestore().runTransaction(async tx => {
        const snap = await tx.get(cloudRef);
        const data = snap.exists ? snap.data() : { used: [...used], vacancyCount };
        const next = { used: Array.isArray(data.used) ? data.used.filter(k => typeof k === "string" && !BLOCKED.has(k)) : [], vacancyCount: Number.isFinite(Number(data.vacancyCount)) ? Math.max(0, Math.min(126, Math.floor(Number(data.vacancyCount)))) : 0 };
        mutator(next);
        tx.set(cloudRef, { used: next.used, vacancyCount: next.vacancyCount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
    } catch (e) { setSyncMessage("同期に失敗しました。通信状態を確認してください。"); }
  }
  function startCloudSync() {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || String(cfg.apiKey).includes("ここに")) {
      setSyncMessage("Firebase設定が未完了です。");
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      cloudRef = firebase.firestore().collection("seatmaps").doc("kaku4");
      cloudRef.onSnapshot(snap => {
        if (!snap.exists) {
          cloudRef.set({ used: [...used], vacancyCount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          return;
        }
        const data = snap.data();
        applyingRemote = true;
        used = new Set(Array.isArray(data.used) ? data.used.filter(k => typeof k === "string" && !BLOCKED.has(k)) : []);
        const n = Number(data.vacancyCount);
        vacancyCount = Number.isFinite(n) ? Math.max(0, Math.min(126, Math.floor(n))) : 0;
        saveLocal(); saveVacancyLocal(); refreshAllSeats();
        applyingRemote = false;
        cloudReady = true;
        setSyncMessage("✓ iPhone・iPadと自動共有中");
      }, () => setSyncMessage("クラウドとの接続に失敗しました。Firestoreルールを確認してください。"));
    } catch (_) { setSyncMessage("Firebase設定を確認してください。"); }
  }
  const loginPanel = document.getElementById("loginPanel");
  const appContent = document.getElementById("appContent");
  const loginMessage = document.getElementById("loginMessage");
  function authError(e) {
    const messages = {
      "auth/invalid-email":"メールアドレスの形式を確認してください。",
      "auth/weak-password":"パスワードは6文字以上にしてください。",
      "auth/email-already-in-use":"このメールアドレスは登録済みです。「ログイン」をお試しください。",
      "auth/invalid-credential":"メールアドレスまたはパスワードが違います。",
      "auth/user-not-found":"アカウントがありません。「新規登録」をお試しください。",
      "auth/wrong-password":"パスワードが違います。",
      "auth/network-request-failed":"通信状態を確認してください。"
    };
    loginMessage.textContent = messages[e.code] || "認証に失敗しました。入力内容と通信状態を確認してください。";
  }
  function credentials() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if (!email || !password) { loginMessage.textContent = "メールアドレスとパスワードを入力してください。"; return null; }
    return {email,password};
  }
  document.getElementById("signUpButton").addEventListener("click", async () => {
    const c = credentials(); if (!c) return;
    loginMessage.textContent = "登録しています…";
    try { await firebase.auth().createUserWithEmailAndPassword(c.email,c.password); }
    catch(e) { authError(e); }
  });
  document.getElementById("signInButton").addEventListener("click", async () => {
    const c = credentials(); if (!c) return;
    loginMessage.textContent = "ログインしています…";
    try { await firebase.auth().signInWithEmailAndPassword(c.email,c.password); }
    catch(e) { authError(e); }
  });
  document.getElementById("signOutButton").addEventListener("click", async () => {
    await firebase.auth().signOut();
    cloudReady = false; cloudRef = null;
  });
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    firebase.auth().onAuthStateChanged(user => {
      cloudReady = false;
      if (user) {
        loginPanel.hidden = true; appContent.hidden = false;
        document.getElementById("signedInEmail").textContent = user.email || "ログイン中";
        setSyncMessage("クラウドに接続しています…");
            } else {
        loginPanel.hidden = false; appContent.hidden = true;
        document.getElementById("signedInEmail").textContent = "";
        setSyncMessage("ログインすると共有が始まります。");
      }
    });
  } catch (_) { loginMessage.textContent = "Firebase設定を確認してください。"; }
  function updateVacancy() {
    document.getElementById("vacancyCount").textContent = vacancyCount;
    document.getElementById("attendeeCount").textContent = 126 - vacancyCount;
    document.getElementById("countVacancy").disabled = vacancyCount >= 126;
    document.getElementById("undoVacancy").disabled = vacancyCount <= 0;
  }
  function showPage(page) {
    const attendance = page === "attendance";
    document.getElementById("seatPanel").hidden = attendance;
    document.getElementById("attendancePanel").hidden = !attendance;
    document.getElementById("seatPageButton").classList.toggle("active", !attendance);
    document.getElementById("attendancePageButton").classList.toggle("active", attendance);
    document.getElementById("seatPageButton").setAttribute("aria-pressed", String(!attendance));
    document.getElementById("attendancePageButton").setAttribute("aria-pressed", String(attendance));
  }
  document.getElementById("seatPageButton").addEventListener("click", () => showPage("seat"));
  document.getElementById("attendancePageButton").addEventListener("click", () => showPage("attendance"));
  document.getElementById("countVacancy").addEventListener("click", () => {
    if (vacancyCount < 126) { vacancyCount++; saveVacancyLocal(); updateVacancy(); writeCloud(d => { d.vacancyCount = Math.min(126, d.vacancyCount + 1); }); }
  });
  document.getElementById("undoVacancy").addEventListener("click", () => {
    if (vacancyCount > 0) { vacancyCount--; saveVacancyLocal(); updateVacancy(); writeCloud(d => { d.vacancyCount = Math.max(0, d.vacancyCount - 1); }); }
  });
  document.getElementById("resetVacancy").addEventListener("click", () => {
    if (!confirm("空席カウントを0に戻しますか？")) return;
    vacancyCount = 0; saveVacancyLocal(); updateVacancy(); writeCloud(d => { d.vacancyCount = 0; });
  });
  function updateStats() {
    document.getElementById("used").textContent = used.size;
    document.getElementById("empty").textContent = total - used.size;
  }
  function setMode(next) {
    mode = next;
    document.body.dataset.mode = next;
    for (const id of ["paint","erase"]) {
      const active = id === next;
      document.getElementById(id).classList.toggle("active", active);
      document.getElementById(id).setAttribute("aria-pressed", String(active));
    }
  }
  document.getElementById("paint").addEventListener("click", () => setMode("paint"));
  document.getElementById("erase").addEventListener("click", () => setMode("erase"));
  const blank = document.createElement("div");
  grid.appendChild(blank);
  for (let c=0;c<COLS;c++) {
    const h=document.createElement("div"); h.className="colhead"; h.textContent=FIRST_SEAT+c; grid.appendChild(h);
  }
  for (let r=1;r<=ROWS;r++) {
    const rh=document.createElement("div"); rh.className="rowhead"; rh.textContent=r; grid.appendChild(rh);
    for (let c=0;c<COLS;c++) {
      const seatNo=FIRST_SEAT+c, key=`${r}-${seatNo}`;
      const b=document.createElement("button");
      b.type="button"; b.className="seat"; b.setAttribute("aria-label",`第${r}列 ${seatNo}番`);
      if (BLOCKED.has(key)) {
        b.classList.add("blocked"); b.disabled=true; b.setAttribute("aria-label",`第${r}列 ${seatNo}番 使用不可`);
      } else {
        b.textContent=seatNo;
        b.addEventListener("click", () => {
          if (mode==="paint") used.add(key); else used.delete(key);
          saveLocal(); renderSeat(b,key); updateStats();
          writeCloud(d => { const set = new Set(d.used); if (mode === "paint") set.add(key); else set.delete(key); d.used = [...set]; });
        });
        renderSeat(b,key);
      }
      grid.appendChild(b);
    }
  }
  function renderSeat(button,key) {
    const isUsed=used.has(key);
    button.classList.toggle("used",isUsed);
    button.setAttribute("aria-pressed",String(isUsed));
  }
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("全ての座席を空席に戻しますか？")) return;
    used.clear(); saveLocal(); writeCloud(d => { d.used = []; });
    document.querySelectorAll(".seat:not(.blocked)").forEach(b => b.classList.remove("used"));
    document.querySelectorAll(".seat:not(.blocked)").forEach(b => b.setAttribute("aria-pressed","false"));
    updateStats();
  });
  updateStats();
  updateVacancy();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
